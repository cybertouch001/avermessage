<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>AverChat</title>
<meta name="description" content="AverChat — chats, groups, channels, status, voice notes, files, voice and video calls.">
<meta name="theme-color" content="#0c0718">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-96.png"><link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta property="og:title" content="AverChat"><meta property="og:description" content="Chats, groups, channels, status, voice notes, files, voice and video calls."><meta property="og:image" content="/icons/icon-512.png">
<link rel="stylesheet" href="/css/app.css?v=3"><link rel="stylesheet" href="/css/v2.css?v=3">
<style>.boot{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font:700 22px system-ui,sans-serif;background:#0c0718;color:#f3eefe}</style>
</head><body><div id="root"><div class="boot"><img id="boot-logo" src="/icons/icon-192.png" alt="" width="96" height="96"><span id="boot-name">AverChat</span><div class="bar-l"><i></i></div></div></div>
<div class="offline-bar">No connection — reconnecting…</div>
<script>try{var b=JSON.parse(localStorage.getItem('avm.brand')||'{}');var bt=document.querySelector('.boot');if(b.bg&&b.theme!=='light'){bt.style.background=b.bg;document.body.style.background=b.bg}if(b.text&&b.theme!=='light')bt.style.color=b.text;if(b.theme==='light'){bt.style.background=b.bg||'#f5f3fb';bt.style.color=b.text||'#1b1630'}if(b.app_name){document.getElementById('boot-name').textContent=b.app_name;document.title=b.app_name}if(b.logo)document.getElementById('boot-logo').src='/api/brand/'+b.logo}catch(e){}</script>
<script type="module" src="/js/main.js?v=3"></script></body></html>
