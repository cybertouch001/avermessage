<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AverChat Admin</title><link rel="icon" href="/icons/icon-96.png">
<style>
*{box-sizing:border-box}:root{--p:#7c3aed;--p2:#d946ef;--bg:#0b0816;--panel:#161027;--panel2:#1f1735;--text:#f1edfb;--muted:#a59cc0;--line:#2c2445;--ok:#22c55e;--bad:#ef4444}
body{margin:0;font:14.5px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.btn{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}.btn.bad{background:var(--bad)}.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;width:100%}input:focus,select:focus{border-color:var(--p)}
input[type=color]{padding:2px;width:46px;height:36px;cursor:pointer}input[type=checkbox]{width:auto;transform:scale(1.25)}input[type=range]{padding:0}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 0%,#7c3aed66,transparent 55%),radial-gradient(circle at 100% 100%,#d946ef44,transparent 55%)}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px;width:100%;max-width:380px;text-align:center}
.lcard img{width:80px;height:80px;border-radius:22px}.lcard h1{margin:10px 0 4px}.lcard form{text-align:left;display:grid;gap:10px;margin-top:16px}
.err{color:var(--bad);min-height:18px;font-size:13px}
.app{display:flex;min-height:100vh}
nav{width:230px;background:var(--panel);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
nav .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-weight:700;font-size:17px}nav .brand img{width:34px;height:34px;border-radius:10px}
nav button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:600}nav button.on{background:linear-gradient(135deg,#7c3aed33,#d946ef22);color:var(--text)}
nav .sp{flex:1}
main{flex:1;padding:22px 26px;min-width:0}
h2{margin:0 0 4px;font-size:22px}.sub{color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.stat b{display:block;font-size:26px}.stat span{color:var(--muted);font-size:13px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.box h3{margin:0 0 10px;font-size:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel)}
.tw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#555;margin-right:6px}.dot.on{background:var(--ok)}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;background:var(--panel2);border:1px solid var(--line)}.tag.bad{background:#ef444422;color:#fca5a5;border-color:#ef444455}
.presets{display:flex;gap:10px;flex-wrap:wrap}.preset{border:2px solid var(--line);border-radius:14px;padding:8px;background:var(--panel2);width:118px;text-align:center;font-size:12.5px}.preset.on{border-color:var(--p)}
.preset i{display:block;height:34px;border-radius:9px;margin-bottom:6px}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.colors label{display:flex;align-items:center;gap:8px;font-size:13px}
.vids{display:flex;gap:12px;flex-wrap:wrap}.vid{width:120px;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel2);text-align:center;font-size:12px;padding-bottom:6px;position:relative}.vid.on{border-color:var(--p)}.vid video{width:100%;height:180px;object-fit:cover;display:block;background:#000}.vid .x{position:absolute;top:4px;right:4px;background:#000a;border:0;color:#fff;border-radius:6px;font-size:11px;padding:2px 6px}
.preview{width:250px;height:470px;border-radius:30px;border:6px solid #000;overflow:hidden;position:relative;flex:none;box-shadow:0 20px 50px #0008}
.pv-bg{position:absolute;inset:0}.pv-bar{position:relative;padding:14px;display:flex;gap:8px;align-items:center;font-weight:700}.pv-bar img{width:28px;height:28px;border-radius:8px}
.pv-chips{position:relative;display:flex;gap:6px;padding:0 12px}.pv-chips span{padding:4px 10px;border-radius:99px;font-size:11px}
.pv-row{position:relative;margin:8px 10px;padding:9px;border-radius:12px;display:flex;gap:8px;align-items:center;font-size:12px}.pv-row i{width:30px;height:30px;border-radius:50%;flex:none}
.pv-b{position:relative;margin:6px 12px;padding:7px 10px;border-radius:14px;font-size:12px;max-width:70%}
.pv-nav{position:absolute;left:8px;right:8px;bottom:8px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:space-around;font-size:10px}
.pv-plus{width:36px;height:36px;border-radius:50%;margin-top:-18px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 18px;border-radius:12px;z-index:99;font-size:14px}
.note{background:#7c3aed1f;border:1px solid #7c3aed55;border-radius:12px;padding:10px 12px;font-size:13px;color:#ddd3fb}
@media (max-width:800px){.app{flex-direction:column}nav{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap}nav .sp,nav .brand{display:none}main{padding:14px}.grid2{grid-template-columns:1fr}}
</style></head><body><div id="root"></div><script type="module" src="/js/admin.js?v=3"></script></body></html>
